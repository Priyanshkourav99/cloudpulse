apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudpulse-frontend
  namespace: cloudpulse
  labels:
    app: cloudpulse
    component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudpulse
      component: frontend
  template:
    metadata:
      labels:
        app: cloudpulse
        component: frontend
    spec:
      containers:
        - name: frontend
          image: ${ACR_NAME}.azurecr.io/cloudpulse-frontend:latest
          ports:
            - containerPort: 80
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15

