apiVersion: v1
kind: Service
metadata:
  name: cloudpulse-backend
  namespace: cloudpulse
  labels:
    app: cloudpulse
    component: backend
spec:
  type: ClusterIP
  selector:
    app: cloudpulse
    component: backend
  ports:
    - port: 3001
      targetPort: 3001
      protocol: TCP
      name: http

